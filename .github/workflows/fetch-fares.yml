name: Fetch IndiGo BluChip deals

on:
  schedule:
    - cron: "0 3 * * *" # ~08:30 IST
    - cron: "0 15 * * *" # ~20:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check session profile secret
        id: check-secret
        run: |
          if [ -z "$INDIGO_SESSION_PROFILE_B64" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::INDIGO_SESSION_PROFILE_B64 secret is not set — skipping cloud scan. The Chrome extension (extension/) handles fare tracking locally in your browser and does not need this secret. To also enable the cloud pipeline, follow the docs/grab.html flow to capture a session and save it as a GitHub secret."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          INDIGO_SESSION_PROFILE_B64: ${{ secrets.INDIGO_SESSION_PROFILE_B64 }}

      - uses: actions/setup-python@v5
        if: steps.check-secret.outputs.skip == 'false'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check-secret.outputs.skip == 'false'
        run: pip install requests

      - name: Restore IndiGo session profile
        if: steps.check-secret.outputs.skip == 'false'
        run: echo "$INDIGO_SESSION_PROFILE_B64" | base64 -d > session_profile.json
        env:
          INDIGO_SESSION_PROFILE_B64: ${{ secrets.INDIGO_SESSION_PROFILE_B64 }}

      - name: Fetch deals
        if: steps.check-secret.outputs.skip == 'false'
        run: python scripts/fetch_deals.py

      - name: Commit and push updated data
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json docs/data.json
          git diff --cached --quiet || git commit -m "Update fare deals (automated)"
          git push
