name: Fetch IndiGo BluChip deals

on:
  schedule:
    - cron: "0 3 * * *" # ~08:30 IST
    - cron: "0 15 * * *" # ~20:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Restore IndiGo session profile
        run: echo "$INDIGO_SESSION_PROFILE_B64" | base64 -d > session_profile.json
        env:
          INDIGO_SESSION_PROFILE_B64: ${{ secrets.INDIGO_SESSION_PROFILE_B64 }}

      - name: Fetch deals
        run: python scripts/fetch_deals.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json docs/data.json
          git diff --cached --quiet || git commit -m "Update fare deals (automated)"
          git push
