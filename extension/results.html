<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IndiGo BluChip Deals</title>
  <style>
    body { background: #020617; color: #f1f5f9; font: 14px/1.5 -apple-system, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    h1 { color: #fbbf24; font-size: 20px; margin-bottom: 4px; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-size: 13px; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; color: #f1f5f9; padding: 6px 10px; font-size: 13px; }
    button.primary { background: #f59e0b; color: #0f172a; border: none; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: #fbbf24; }
    .banner { background: #1c1917; border: 1px solid #ef4444; color: #fca5a5; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
    .deal { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; text-decoration: none; color: inherit; }
    .deal:hover { border-color: #f59e0b; }
    .deal .left { display: flex; align-items: center; gap: 8px; }
    .deal .route { color: #e2e8f0; font-weight: 500; }
    .deal .sub { color: #64748b; font-size: 12px; }
    .deal .points { color: #fbbf24; font-weight: 700; font-size: 15px; }
    .pill { background: #064e3b; color: #34d399; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; }
    #empty { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <h1>IndiGo BluChip Deals</h1>
  <div class="meta-row">
    <span id="last-updated"></span>
    <div class="controls">
      <select id="filter-route"></select>
      <select id="sort-by">
        <option value="points">Sort: cheapest first</option>
        <option value="date">Sort: soonest first</option>
      </select>
      <button class="primary" id="scan-btn">Scan now</button>
    </div>
  </div>
  <div id="banner-area"></div>
  <div id="list"></div>
  <p id="empty" hidden>No deals captured yet. Run a scan from here or from the toolbar popup.</p>

  <script src="results.js"></script>
</body>
</html>
