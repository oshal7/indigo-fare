<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Deal Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">

    <div class="flex items-center gap-2 mb-3">
      <select id="route-select" class="bg-slate-800 text-slate-100 rounded-lg px-3 py-2 text-sm flex-1"></select>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3" id="direction-tabs"></div>

    <div id="last-updated" class="text-xs text-slate-400 mb-2 flex items-center gap-1">
      <span>Loading...</span>
    </div>

    <div id="stale-banner" hidden class="bg-red-900/60 border border-red-700 text-red-200 text-sm rounded-lg px-3 py-2 mb-3">
      Data is stale - session may have expired. <a href="grab.html" class="underline">Re-grab your session</a>.
    </div>

    <h2 class="text-sm font-semibold text-amber-400 mb-2 tracking-wide">
      🔥 TOP SWEET-SPOT DEALS (Next 6 Months)
    </h2>

    <ul id="deals-list" class="space-y-2"></ul>

    <p id="empty-state" hidden class="text-slate-400 text-sm mt-4">
      No deals yet - the scheduled job hasn't run or hasn't found anything under the points baseline.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
